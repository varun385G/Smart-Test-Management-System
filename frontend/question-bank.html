<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Bank — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-ghost btn-sm" onclick="location.href='/manage-tests.html'">← Back</button>
      <div>
        <div style="font-weight:700; font-size:15px;">Question Bank</div>
        <div id="bankCounter" style="font-size:12px; color:var(--muted);">Loading…</div>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">＋ Add Question</button>
  </header>

  <main style="max-width:900px; margin:auto; padding:24px 20px;">

    <!-- Filters -->
    <div class="card" style="padding:16px 20px; margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
      <input id="filterSubject" placeholder="Filter by subject…" style="flex:1; min-width:140px;" oninput="loadQuestions()">
      <input id="filterTopic"   placeholder="Filter by topic…"   style="flex:1; min-width:140px;" oninput="loadQuestions()">
      <button class="btn btn-sm" onclick="clearFilters()">Clear</button>
    </div>

    <!-- List -->
    <div id="bankList"></div>

  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box" style="max-width:640px; max-height:90vh; overflow-y:auto;">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add Question to Bank</span>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>
      <div style="padding:20px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Subject</label>
            <input id="bSubject" placeholder="e.g. Mathematics">
          </div>
          <div class="form-group">
            <label class="form-label">Topic</label>
            <input id="bTopic" placeholder="e.g. Algebra">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Question Type</label>
          <select id="bType" onchange="renderBankAnswerFields()" style="font-size:14px; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; width:100%; background:var(--bg); color:var(--text); font-family:var(--font-main);">
            <option value="MCQ">MCQ — Single correct</option>
            <option value="MSQ">MSQ — Multiple correct</option>
            <option value="NAT">NAT — Numeric answer</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Question Text *</label>
          <textarea id="bQuestion" rows="3" placeholder="Enter your question here…" style="width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:var(--font-main); resize:vertical; background:var(--bg); color:var(--text);"></textarea>
        </div>
        <div id="bAnswerFields"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Marks</label>
            <input id="bMarks" type="number" min="1" value="1">
          </div>
          <div class="form-group">
            <label class="form-label">Negative Marks (0 = none)</label>
            <input id="bNegMarks" type="number" min="0" value="0" step="0.25">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Explanation <span style="color:var(--muted); font-weight:400;">(optional)</span></label>
          <textarea id="bExplanation" rows="2" placeholder="Explain the correct answer…" style="width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:var(--font-main); resize:vertical; background:var(--bg); color:var(--text);"></textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn" onclick="closeAddModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveToBank()">💾 Save to Bank</button>
        </div>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="question-bank.js"></script>
</body>
</html>
