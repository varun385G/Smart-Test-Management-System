<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Tests — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
      <div style="font-weight:700; font-size:15px;">Manage Tests</div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="location.href='/create-test.html'">＋ Create New Test</button>
  </header>

  <main style="max-width:1100px; margin:auto; padding:24px 20px;">

    <!-- Search & filter bar -->
    <div class="section-card" style="margin-bottom:20px; padding:14px 18px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <input id="searchInput" placeholder="🔍  Search by title or test ID…"
               oninput="filterTests()" style="max-width:280px; flex:1;">
        <select id="filterStatus" onchange="filterTests()" style="width:auto; flex-shrink:0;">
          <option value="all">All Tests</option>
          <option value="published">Published</option>
          <option value="unpublished">Unpublished</option>
        </select>
      </div>
    </div>

    <!-- Table card -->
    <div class="section-card">
      <table class="table" id="testTableWrap">
        <thead>
          <tr>
            <th>Test ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Attempts</th>
            <th style="width:220px;">Actions</th>
          </tr>
        </thead>
        <tbody id="testTable">
          <tr><td colspan="5"><div class="skeleton" style="height:16px; margin:6px 0;"></div></td></tr>
          <tr><td colspan="5"><div class="skeleton" style="height:16px; margin:6px 0; width:70%;"></div></td></tr>
          <tr><td colspan="5"><div class="skeleton" style="height:16px; margin:6px 0; width:55%;"></div></td></tr>
        </tbody>
      </table>
      <div id="emptyMsg" style="display:none; text-align:center; padding:40px; color:var(--muted);">
        <div style="font-size:32px; margin-bottom:8px;">📋</div>
        <div style="font-weight:600;">No tests found</div>
      </div>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="manage-tests.js"></script>
</body>
</html>
