<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #e0e7ff 0%, #f0fdf4 100%);">

  <div style="width:100%; max-width:420px; padding:20px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:56px;height:56px;background:var(--primary);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:24px;margin-bottom:12px;">S</div>
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">Student Portal</h1>
      <p style="color:var(--muted); font-size:14px;">Enter your test credentials to begin</p>
    </div>

    <div class="card" style="padding:28px;">
      <div class="form-group">
        <label class="form-label">Test ID</label>
        <input id="testId" placeholder="e.g. ST-123456" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="form-group">
        <label class="form-label">Test Password</label>
        <input id="password" type="password" placeholder="Enter test password">
      </div>
      <div class="form-group">
        <label class="form-label">Your Full Name</label>
        <input id="name" placeholder="e.g. John Smith">
      </div>
      <div class="form-group">
        <label class="form-label">Register Number</label>
        <input id="reg" placeholder="e.g. 21CS001">
      </div>

      <button class="btn btn-primary" style="width:100%; margin-top:4px;" onclick="handleSubmit()" id="submitBtn">
        Enter Exam →
      </button>

      <div id="messageBox" style="margin-top:16px;"></div>
    </div>

    <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--muted);">
      Staff? <a href="/staff.html" style="color:var(--primary); font-weight:600;">Staff Login →</a>
    </p>
  </div>

  <script src="ui.js"></script>
  <script src="student.js"></script>
</body>
</html>
