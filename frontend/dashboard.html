<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:36px;height:36px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:16px;">S</div>
      <div>
        <div style="font-weight:700; font-size:15px;" id="staffName">Welcome</div>
        <div style="font-size:12px; color:var(--muted);" id="staffRole"></div>
      </div>
    </div>
    <div style="position:relative;">
      <button class="btn btn-ghost btn-sm" onclick="toggleProfileMenu()" id="profileBtn" style="display:flex;align-items:center;gap:6px;">
        <div style="width:28px;height:28px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--primary);font-weight:700;" id="profileInitial">?</div>
        <span>▾</span>
      </button>
      <div id="profileMenu" style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);min-width:190px;z-index:200;overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--muted);">Account Settings</div>
        <button onclick="openChangeEmail()" style="width:100%;text-align:left;padding:11px 16px;font-size:13.5px;background:none;border:none;cursor:pointer;color:var(--text);font-family:var(--font-main);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">✉️ Change Email</button>
        <button onclick="openChangePassword()" style="width:100%;text-align:left;padding:11px 16px;font-size:13.5px;background:none;border:none;cursor:pointer;color:var(--text);font-family:var(--font-main);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">🔑 Change Password</button>
        <div style="border-top:1px solid var(--border);"></div>
        <button onclick="logout()" style="width:100%;text-align:left;padding:11px 16px;font-size:13.5px;background:none;border:none;cursor:pointer;color:var(--danger);font-family:var(--font-main);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">↩ Sign out</button>
      </div>
    </div>
  </header>

  <!-- Change Email Modal -->
  <div class="modal-overlay" id="changeEmailModal">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <span class="modal-title">✉️ Change Email</span>
        <button class="modal-close" onclick="closeModal('changeEmailModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Current Password *</label>
        <input id="ceCurrentPw" type="password" placeholder="Enter your current password">
      </div>
      <div class="form-group">
        <label class="form-label">New Email *</label>
        <input id="ceNewEmail" type="email" placeholder="Enter new email address">
      </div>
      <p id="ceMsg" style="font-size:13px;margin-bottom:10px;min-height:18px;"></p>
      <button class="btn btn-primary" style="width:100%;" onclick="submitChangeEmail()">Update Email</button>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <span class="modal-title">🔑 Change Password</span>
        <button class="modal-close" onclick="closeModal('changePasswordModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Current Password *</label>
        <input id="cpCurrentPw" type="password" placeholder="Enter your current password">
      </div>
      <div class="form-group">
        <label class="form-label">New Password *</label>
        <input id="cpNewPw" type="password" placeholder="Enter new password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password *</label>
        <input id="cpConfirmPw" type="password" placeholder="Re-enter new password">
      </div>
      <p id="cpMsg" style="font-size:13px;margin-bottom:10px;min-height:18px;"></p>
      <button class="btn btn-primary" style="width:100%;" onclick="submitChangePassword()">Update Password</button>
    </div>
  </div>

  <main style="max-width:1100px; margin:auto; padding:24px 20px;">

    <!-- Stats row -->
    <div class="stats-grid" id="statsGrid" style="margin-bottom:24px;">
      <div class="skeleton" style="height:100px; border-radius:14px;"></div>
      <div class="skeleton" style="height:100px; border-radius:14px;"></div>
      <div class="skeleton" style="height:100px; border-radius:14px;"></div>
      <div class="skeleton" style="height:100px; border-radius:14px;"></div>
    </div>

    <!-- Cards grid -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px;">

      <!-- Admin controls -->
      <div class="card admin-only" style="display:none;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <div class="section-icon" style="background:#fef3c7;">👥</div>
          <div>
            <div style="font-weight:700; font-size:15px;">Admin Controls</div>
            <div style="font-size:12.5px; color:var(--muted);">Staff & system management</div>
          </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-sm" onclick="goCreateStaff()">＋ Create Staff</button>
          <button class="btn btn-sm" onclick="goManageStaff()">Manage Staff</button>
        </div>
      </div>

      <!-- Test management -->
      <div class="card">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <div class="section-icon" style="background:#e0e7ff;">📝</div>
          <div>
            <div style="font-weight:700; font-size:15px;">Test Management</div>
            <div style="font-size:12.5px; color:var(--muted);">Create, manage and evaluate</div>
          </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" onclick="goToCreateTest()">＋ Create Test</button>
          <button class="btn btn-sm" onclick="goToManageTests()">Manage Tests</button>
          <button class="btn btn-sm" onclick="goToResults()">View Results</button>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="card" style="grid-column: 1 / -1;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <div class="section-icon" style="background:#d1fae5;">⚡</div>
          <div style="font-weight:700; font-size:15px;">Recent Activity</div>
        </div>
        <div id="activityFeed" style="color:var(--muted); font-size:13.5px;">
          <div class="skeleton" style="height:16px; width:60%; margin-bottom:10px;"></div>
          <div class="skeleton" style="height:16px; width:45%;"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
