<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:15px;">S</div>
      <span style="font-weight:700; font-size:15px;">Student Portal</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="location.href='/'">← Home</button>
  </header>

  <main style="max-width:520px; margin:auto; padding:24px 20px;">

    <div class="card" style="padding:28px; margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px;">
        <div style="width:48px;height:48px;background:var(--primary-light);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;">🎓</div>
        <div>
          <div style="font-weight:700; font-size:16px;" id="name">Student</div>
          <div style="font-size:13px; color:var(--muted);">Test ID: <strong id="testId">—</strong></div>
        </div>
      </div>

      <div style="background:var(--bg); border-radius:10px; padding:14px 16px; margin-bottom:20px;">
        <div style="font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">Exam Status</div>
        <div id="status" style="font-size:15px; font-weight:700;"></div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="startBtn" class="btn btn-primary" style="flex:1;">Start Exam →</button>
        <button id="resultBtn" class="btn" style="flex:1;">View Result</button>
      </div>
    </div>

  </main>

  <script src="ui.js"></script>
  <script src="student-dashboard.js"></script>
</body>
</html>
