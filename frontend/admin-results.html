<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Results — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
      <div>
        <div style="font-weight:700; font-size:15px;">Admin Results Dashboard</div>
        <div style="font-size:12px; color:var(--muted);">View results grouped by staff and test</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btnDownloadAllExcel" class="btn btn-sm" onclick="downloadAllExcel()" disabled>⬇ All Excel</button>
      <button id="btnDownloadAllPdf"   class="btn btn-sm" onclick="downloadAllPdf()"   disabled>⬇ All PDF</button>
    </div>
  </header>

  <main style="max-width:1200px; margin:auto; padding:24px 20px;">
    <div id="adminResults">
      <div class="skeleton" style="height:120px; border-radius:14px; margin-bottom:16px;"></div>
      <div class="skeleton" style="height:120px; border-radius:14px;"></div>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="admin-results.js"></script>
</body>
</html>
