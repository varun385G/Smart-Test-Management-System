<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#e0e7ff 0%,#f0fdf4 100%);">

  <div style="width:100%; max-width:400px; padding:20px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:56px;height:56px;background:var(--primary);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:24px;margin-bottom:12px;">S</div>
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">Staff Login</h1>
      <p style="color:var(--muted); font-size:14px;">Enter your credentials to continue</p>
    </div>

    <div class="card" style="padding:28px;">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="password" type="password" placeholder="Enter your password">
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:4px;" onclick="login()">Login →</button>
      <p id="msg" style="color:var(--danger); margin-top:12px; font-size:13.5px; text-align:center;"></p>
      <div style="text-align:center; margin-top:8px;">
        <button onclick="openForgotPassword()" style="background:none; border:none; color:var(--primary); font-size:13px; cursor:pointer; font-weight:600; text-decoration:underline;">Forgot Password?</button>
      </div>
    </div>

    <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--muted);">
      Student? <a href="/student.html" style="color:var(--primary); font-weight:600;">Student Access →</a>
    </p>
  </div>

  <script src="ui.js"></script>
  <script>
    async function login() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg      = document.getElementById('msg');
      msg.textContent = '';

      if (!email || !password) { msg.textContent = 'Please enter email and password'; return; }

      try {
        const res  = await fetch('/api/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.message || 'Login failed'; return; }

        sessionStorage.setItem('staffId',   data.staffId);
        sessionStorage.setItem('staffName', data.name);
        sessionStorage.setItem('staffRole', data.role);
        window.location.href = '/dashboard.html';
      } catch {
        msg.textContent = 'Server error. Try again.';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>

  <!-- ── Forgot Password Modal ── -->
  <div id="forgotModal" style="display:none; position:fixed; inset:0; z-index:999; background:rgba(15,23,42,0.55); display:none; align-items:center; justify-content:center;">
    <div style="background:var(--card,#fff); border-radius:16px; padding:32px 28px; max-width:420px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.18);">

      <!-- Step 1: Enter email -->
      <div id="fpStep1">
        <h3 style="margin-bottom:6px; font-size:18px;">Forgot Password</h3>
        <p style="color:var(--muted,#64748b); font-size:13.5px; margin-bottom:20px;">Enter your registered email to get your security question.</p>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="fpEmail" type="email" placeholder="Enter your email">
        </div>
        <p id="fpMsg1" style="color:#dc2626; font-size:13px; margin-bottom:10px; min-height:18px;"></p>
        <div style="display:flex; gap:10px;">
          <button class="btn" style="flex:1;" onclick="closeForgotPassword()">Cancel</button>
          <button class="btn btn-primary" style="flex:1;" onclick="fetchSecurityQuestion()">Next →</button>
        </div>
      </div>

      <!-- Step 2: Answer security question + new password -->
      <div id="fpStep2" style="display:none;">
        <h3 style="margin-bottom:6px; font-size:18px;">Security Question</h3>
        <p style="color:var(--muted,#64748b); font-size:13.5px; margin-bottom:16px;">Answer your security question to reset your password.</p>
        <div style="background:#f1f5f9; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:14px; font-weight:600; color:#1e293b;" id="fpQuestionDisplay"></div>
        <div class="form-group">
          <label class="form-label">Your Answer</label>
          <input id="fpAnswer" type="text" placeholder="Type your answer">
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input id="fpNewPassword" type="password" placeholder="Enter new password (min 4 chars)">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input id="fpConfirmPassword" type="password" placeholder="Confirm new password">
        </div>
        <p id="fpMsg2" style="color:#dc2626; font-size:13px; margin-bottom:10px; min-height:18px;"></p>
        <div style="display:flex; gap:10px;">
          <button class="btn" style="flex:1;" onclick="backToStep1()">← Back</button>
          <button class="btn btn-primary" style="flex:1;" id="fpResetBtn" onclick="submitForgotPassword()">Reset Password</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    function openForgotPassword() {
      document.getElementById('fpStep1').style.display = 'block';
      document.getElementById('fpStep2').style.display = 'none';
      document.getElementById('fpEmail').value = '';
      document.getElementById('fpMsg1').textContent = '';
      document.getElementById('fpMsg2').textContent = '';
      document.getElementById('forgotModal').style.display = 'flex';
    }
    function closeForgotPassword() {
      document.getElementById('forgotModal').style.display = 'none';
    }
    function backToStep1() {
      document.getElementById('fpStep2').style.display = 'none';
      document.getElementById('fpStep1').style.display = 'block';
    }

    async function fetchSecurityQuestion() {
      const email = document.getElementById('fpEmail').value.trim();
      const msg   = document.getElementById('fpMsg1');
      msg.textContent = '';
      if (!email) { msg.textContent = 'Please enter your email.'; return; }

      try {
        const res  = await fetch('/api/staff/security-question/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.message || 'Failed'; return; }

        document.getElementById('fpQuestionDisplay').textContent = data.securityQuestion;
        document.getElementById('fpAnswer').value = '';
        document.getElementById('fpNewPassword').value = '';
        document.getElementById('fpConfirmPassword').value = '';
        document.getElementById('fpMsg2').textContent = '';
        document.getElementById('fpStep1').style.display = 'none';
        document.getElementById('fpStep2').style.display = 'block';
      } catch {
        msg.textContent = 'Server error. Try again.';
      }
    }

    async function submitForgotPassword() {
      const email       = document.getElementById('fpEmail').value.trim();
      const answer      = document.getElementById('fpAnswer').value.trim();
      const newPassword = document.getElementById('fpNewPassword').value.trim();
      const confirmPass = document.getElementById('fpConfirmPassword').value.trim();
      const msg         = document.getElementById('fpMsg2');
      msg.textContent   = '';

      if (!answer)           { msg.textContent = 'Please enter your answer.'; return; }
      if (!newPassword)      { msg.textContent = 'Please enter a new password.'; return; }
      if (newPassword.length < 4) { msg.textContent = 'Password must be at least 4 characters.'; return; }
      if (newPassword !== confirmPass) { msg.textContent = 'Passwords do not match.'; return; }

      const btn = document.getElementById('fpResetBtn');
      btn.disabled = true; btn.textContent = 'Resetting…';

      try {
        const res  = await fetch('/api/staff/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, securityAnswer: answer, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          msg.style.color = '#16a34a';
          msg.textContent = '✅ Password reset! You can now log in.';
          setTimeout(() => closeForgotPassword(), 1800);
        } else {
          msg.style.color = '#dc2626';
          msg.textContent = data.message || 'Failed to reset password.';
        }
      } catch {
        msg.style.color = '#dc2626';
        msg.textContent = 'Server error. Try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    }

    // Close modal on backdrop click
    document.getElementById('forgotModal').addEventListener('click', function(e) {
      if (e.target === this) closeForgotPassword();
    });
  </script>

</body>
</html>
