<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
      <div style="font-weight:700; font-size:15px;">Test Results</div>
    </div>
  </header>

  <main style="max-width:1100px; margin:auto; padding:24px 20px;">
    <div class="section-card">
      <table class="table">
        <thead>
          <tr>
            <th>Test ID</th>
            <th>Title</th>
            <th>Attempts</th>
            <th style="width:120px;">Action</th>
          </tr>
        </thead>
        <tbody id="testResults">
          <tr><td colspan="4" style="text-align:center; color:var(--muted);">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="results-dashboard.js"></script>
</body>
</html>
