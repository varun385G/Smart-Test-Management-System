<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Staff — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
      <div>
        <div style="font-weight:700; font-size:15px;">Create Staff Account</div>
        <div style="font-size:12px; color:var(--muted);">Add a new staff member to the system</div>
      </div>
    </div>
  </header>

  <main style="max-width:520px; margin:auto; padding:24px 20px;">
    <div class="card" style="padding:28px;">
      <div class="form-group">
        <label class="form-label">Staff Name *</label>
        <input id="name" placeholder="Enter staff name" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Staff Email *</label>
        <input id="email" type="email" placeholder="Enter staff email">
      </div>
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:4px;" onclick="createStaff()">Create Staff Account</button>
      <p id="msg" style="margin-top:12px; font-size:13.5px; text-align:center;"></p>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="create-staff.js"></script>
</body>
</html>
