<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Results</title>

  <!-- Styles -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="app.css">

  <!-- Download Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body class="modern-ui">

  <!-- PAGE CONTAINER -->
  <main class="container" style="padding:24px; max-width:900px; margin:auto;">

    <!-- HEADER -->
    <section class="card" style="margin-bottom:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <h2 style="margin:0;">Test Results</h2>
          <p id="testMeta" style="margin:4px 0 0; color:var(--muted); font-size:13px;"></p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="btnDownloadExcel" class="btn btn-primary" onclick="downloadExcel()" disabled
                  style="display:flex; align-items:center; gap:6px;">
            ⬇ Download Excel
          </button>
          <button id="btnDownloadPdf" class="btn btn-primary" onclick="downloadPdf()" disabled
                  style="display:flex; align-items:center; gap:6px;">
            ⬇ Download PDF
          </button>
          <button class="btn" onclick="goDashboard()">Back to Dashboard</button>
        </div>
      </div>
    </section>

    <!-- RESULTS TABLE -->
    <section class="card">
      <table class="table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Register No</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </section>

  </main>

  <!-- SCRIPT -->
  <script src="results.js"></script>

</body>
</html>
