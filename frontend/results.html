<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Results — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <header class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-ghost btn-sm" onclick="goDashboard()">← Back</button>
      <div>
        <div style="font-weight:700; font-size:15px;">Test Results</div>
        <div id="testMeta" style="font-size:12px; color:var(--muted);"></div>
      </div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <div style="position:relative;">
        <button id="btnDownload" class="btn btn-sm" onclick="toggleResultsDropdown(this)" disabled>⬇ Download ▾</button>
        <div id="resultsDlDropdown" style="display:none; position:absolute; right:0; top:calc(100% + 4px); background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:50; min-width:130px; overflow:hidden;">
          <button id="btnDownloadExcel" onclick="downloadExcel(); document.getElementById('resultsDlDropdown').style.display='none';" style="width:100%; text-align:left; padding:10px 16px; font-size:13.5px; background:none; border:none; cursor:pointer; color:var(--text); font-family:var(--font-main);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">📊 Excel</button>
          <button id="btnDownloadPdf"   onclick="downloadPdf();   document.getElementById('resultsDlDropdown').style.display='none';" style="width:100%; text-align:left; padding:10px 16px; font-size:13.5px; background:none; border:none; cursor:pointer; color:var(--text); font-family:var(--font-main);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">📄 PDF</button>
        </div>
      </div>
    </div>
  </header>

  <main style="max-width:960px; margin:auto; padding:24px 20px;">

    <!-- TABS -->
    <div style="display:flex; gap:4px; margin-bottom:16px; background:var(--bg-2); border-radius:10px; padding:4px; width:fit-content;">
      <button id="tabResults"   class="btn btn-primary btn-sm" onclick="showTab('results')">📋 Results</button>
      <button id="tabAnalytics" class="btn btn-sm"             onclick="showTab('analytics')">📊 Analytics</button>
    </div>

    <!-- RESULTS TABLE -->
    <div id="panelResults" class="section-card">
      <table class="table">
        <thead>
          <tr>
            <th>Student</th>
            <th style="text-align:center;">Rank</th>
            <th>Score</th>
            <th style="text-align:center;">Action</th>
          </tr>
        </thead>
        <tbody id="results">
          <tr><td colspan="4" style="text-align:center; color:var(--muted);">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ANALYTICS PANEL -->
    <div id="panelAnalytics" class="section-card" style="display:none;">
      <h3 style="margin-bottom:16px; font-size:15px;">Per-Question Difficulty Analysis</h3>
      <div id="analyticsContainer">
        <p style="color:var(--muted); text-align:center;">Loading analytics…</p>
      </div>
    </div>

  </main>

  <script>
    function showTab(tab) {
      document.getElementById('panelResults').style.display   = tab === 'results'   ? '' : 'none';
      document.getElementById('panelAnalytics').style.display = tab === 'analytics' ? '' : 'none';
      document.getElementById('tabResults').className   = tab === 'results'   ? 'btn btn-primary btn-sm' : 'btn btn-sm';
      document.getElementById('tabAnalytics').className = tab === 'analytics' ? 'btn btn-primary btn-sm' : 'btn btn-sm';
    }
  </script>
  <script src="ui.js"></script>
  <script src="results.js"></script>
</body>
</html>
