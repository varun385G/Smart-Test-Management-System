<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Results — STMS</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="modern-ui">
  <main class="container" style="padding:24px; max-width:960px; margin:auto;">

    <!-- HEADER -->
    <section class="card" style="margin-bottom:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <h2 style="margin:0;">Test Results</h2>
          <p id="testMeta" style="margin:4px 0 0; color:var(--muted); font-size:13px;"></p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="btnDownloadExcel" class="btn btn-primary" onclick="downloadExcel()" disabled>⬇ Excel</button>
          <button id="btnDownloadPdf"   class="btn btn-primary" onclick="downloadPdf()"   disabled>⬇ PDF</button>
          <button class="btn" onclick="goDashboard()">← Dashboard</button>
        </div>
      </div>
    </section>

    <!-- TABS -->
    <div style="display:flex; gap:4px; margin-bottom:16px; background:var(--bg); border-radius:12px; padding:4px; width:fit-content;">
      <button id="tabResults"    class="btn btn-primary btn-sm" onclick="showTab('results')">📋 Results</button>
      <button id="tabAnalytics"  class="btn btn-sm"             onclick="showTab('analytics')">📊 Analytics</button>
    </div>

    <!-- RESULTS TABLE -->
    <section id="panelResults" class="card">
      <table class="table">
        <thead>
          <tr>
            <th>Student</th>
            <th style="text-align:center;">Rank</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </section>

    <!-- ANALYTICS PANEL -->
    <section id="panelAnalytics" class="card" style="display:none;">
      <h3 style="margin-bottom:16px;">Per-Question Difficulty Analysis</h3>
      <div id="analyticsContainer">
        <p style="color:var(--muted); text-align:center;">Loading analytics…</p>
      </div>
    </section>

  </main>

  <script>
    function showTab(tab) {
      document.getElementById('panelResults').style.display   = tab === 'results'   ? '' : 'none';
      document.getElementById('panelAnalytics').style.display = tab === 'analytics' ? '' : 'none';
      document.getElementById('tabResults').className   = tab === 'results'   ? 'btn btn-primary btn-sm' : 'btn btn-sm';
      document.getElementById('tabAnalytics').className = tab === 'analytics' ? 'btn btn-primary btn-sm' : 'btn btn-sm';
    }
  </script>
  <script src="results.js"></script>
</body>
</html>
