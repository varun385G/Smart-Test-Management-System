<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Result — STMS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <!-- PDF library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    .result-opt { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:9px; margin-bottom:6px; font-size:14px; border:1.5px solid var(--border); }
    .result-opt.correct { background:var(--success-light); border-color:var(--success); color:#065f46; }
    .result-opt.wrong   { background:var(--danger-light);  border-color:var(--danger);  color:#7f1d1d; }
    .result-opt.missed  { background:var(--warning-light); border-color:var(--warning); color:#78350f; }
    .score-ring { width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 16px; }
  </style>
</head>
<body>
  <header class="header">
    <div style="font-weight:700; font-size:15px;">My Exam Result</div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary btn-sm" id="downloadPdfBtn" onclick="downloadResultPDF()" style="display:none;">
        ⬇ Download PDF
      </button>
      <button class="btn btn-sm" onclick="location.href='/'">← Home</button>
    </div>
  </header>

  <main style="max-width:800px; margin:auto; padding:24px 20px;">
    <div id="resultContainer">
      <div class="card" style="text-align:center; color:var(--muted); padding:48px;">
        <div class="skeleton" style="height:120px; width:120px; border-radius:50%; margin:0 auto 20px;"></div>
        <div class="skeleton" style="height:20px; width:200px; margin:0 auto 10px;"></div>
        <div class="skeleton" style="height:16px; width:140px; margin:0 auto;"></div>
      </div>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="student-result.js"></script>
</body>
</html>
